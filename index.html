<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>動物視覺光學模擬器 v1.0.6</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
        
        #header-bar { background: rgba(10, 10, 10, 0.95); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; z-index: 10; }
        #header-bar h1 { font-size: 14px; font-weight: 600; color: #ddd; }
        #header-bar .version { font-size: 11px; color: #666; background: #1a1a1a; padding: 2px 6px; border-radius: 4px; }

        #viewfinder { flex: 1; position: relative; width: 100%; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
        
        video { display: none; }
        canvas { display: block; width: 100%; height: 100%; object-fit: cover; }

        #controls { padding: 12px 16px; background: rgba(15, 15, 15, 0.98); display: flex; justify-content: space-around; gap: 8px; z-index: 10; padding-bottom: calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
        button { flex: 1; padding: 12px 6px; border: none; border-radius: 8px; background: #2a2a2a; color: #aaa; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
        button.active { background: #ffaa00; color: #000; font-weight: bold; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,170,0,0.4); }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; color: #888; text-align: center; }
    </style>
</head>
<body>

    <div id="header-bar">
        <h1>動物光學視覺引擎</h1>
        <span class="version">v1.0.6</span>
    </div>

    <div id="viewfinder">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="loading">建立即時光學串流中...</div>
    </div>

    <div id="controls">
        <button class="active" onclick="setMode('human', this)">人類</button>
        <button onclick="setMode('dog', this)">貓狗</button>
        <button onclick="setMode('snake', this)">蛇類熱視</button>
        <button onclick="setMode('insect', this)">昆蟲複眼</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const loading = document.getElementById('loading');
        
        let currentMode = 'human';
        let animationFrameId = null;
        let videoWidth = 0, videoHeight = 0;

        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d', { alpha: false });

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        videoWidth = video.videoWidth;
                        videoHeight = video.videoHeight;
                        resolve();
                    };
                });

                canvas.width = videoWidth;
                canvas.height = videoHeight;
                loading.style.display = 'none';
                
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(renderLoop);
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    await new Promise((r) => { video.onloadedmetadata = r; });
                    videoWidth = video.videoWidth;
                    videoHeight = video.videoHeight;
                    canvas.width = videoWidth;
                    canvas.height = videoHeight;
                    loading.style.display = 'none';
                    
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animationFrameId = requestAnimationFrame(renderLoop);
                } catch (e) {
                    loading.innerText = "無法存取相機，請檢查權限。";
                }
            }
        }

        function renderLoop() {
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                if (currentMode === 'human') {
                    ctx.imageSmoothingEnabled = true;
                    ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
                } else if (currentMode === 'dog') {
                    renderDogScientific();
                } else if (currentMode === 'snake') {
                    renderSnakeScientific();
                } else if (currentMode === 'insect') {
                    renderInsectScientific();
                }
            }
            animationFrameId = requestAnimationFrame(renderLoop);
        }

        function renderDogScientific() {
            const scale = 0.2;
            const sw = Math.floor(videoWidth * scale);
            const sh = Math.floor(videoHeight * scale);
            
            offCanvas.width = sw;
            offCanvas.height = sh;
            offCtx.drawImage(video, 0, 0, sw, sh);
            
            const imgData = offCtx.getImageData(0, 0, sw, sh);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                const l = 0.3 * r + 0.59 * g + 0.11 * b;
                data[i]     = Math.min(255, l * 1.05);
                data[i + 1] = Math.min(255, l * 1.05);
                data[i + 2] = b;
            }
            offCtx.putImageData(imgData, 0, 0);

            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(offCanvas, 0, 0, sw, sh, 0, 0, videoWidth, videoHeight);
        }

        function renderSnakeScientific() {
            const scale = 0.12;
            const sw = Math.floor(videoWidth * scale);
            const sh = Math.floor(videoHeight * scale);

            offCanvas.width = sw;
            offCanvas.height = sh;
            offCtx.drawImage(video, 0, 0, sw, sh);

            const imgData = offCtx.getImageData(0, 0, sw, sh);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                const val = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
                if (val < 64) {
                    data[i] = 0; data[i+1] = 0; data[i+2] = val * 4;
                } else if (val < 128) {
                    data[i] = (val - 64) * 4; data[i+1] = 0; data[i+2] = 255 - (val - 64) * 4;
                } else if (val < 192) {
                    data[i] = 255; data[i+1] = (val - 128) * 4; data[i+2] = 0;
                } else {
                    data[i] = 255; data[i+1] = 255; data[i+2] = (val - 192) * 4;
                }
            }
            offCtx.putImageData(imgData, 0, 0);

            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(offCanvas, 0, 0, sw, sh, 0, 0, videoWidth, videoHeight);
        }

        function renderInsectScientific() {
            const pixelSize = 14;
            const sw = Math.floor(videoWidth / pixelSize);
            const sh = Math.floor(videoHeight / pixelSize);

            offCanvas.width = sw;
            offCanvas.height = sh;
            offCtx.drawImage(video, 0, 0, sw, sh);

            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(offCanvas, 0, 0, sw, sh, 0, 0, videoWidth, videoHeight);

            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            for (let x = 0; x < videoWidth; x += pixelSize) {
                ctx.fillRect(x, 0, 1, videoHeight);
            }
            for (let y = 0; y < videoHeight; y += pixelSize) {
                ctx.fillRect(0, y, videoWidth, 1);
            }
        }

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        initCamera();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
            } else if (video.srcObject) {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(renderLoop);
            }
        });
    </script>
</body>
</html>
