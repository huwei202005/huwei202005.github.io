<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>科學級動物視覺精準模擬器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
        
        #viewfinder { flex: 1; position: relative; width: 100%; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
        
        video { display: none; }
        canvas { display: block; width: 100%; height: 100%; object-fit: cover; }

        #controls { padding: 12px 16px; background: rgba(15, 15, 15, 0.98); display: flex; justify-content: space-around; gap: 8px; z-index: 10; padding-bottom: calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
        button { flex: 1; padding: 12px 6px; border: none; border-radius: 8px; background: #2a2a2a; color: #aaa; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
        button.active { background: #ffaa00; color: #000; font-weight: bold; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,170,0,0.4); }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; color: #888; text-align: center; }
    </style>
</head>
<body>

    <div id="viewfinder">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="loading">正在啟動相機與科學視覺引擎...</div>
    </div>

    <div id="controls">
        <button class="active" onclick="setMode('human', this)">人類</button>
        <button onclick="setMode('dog', this)">貓狗</button>
        <button onclick="setMode('snake', this)">蛇類熱視</button>
        <button onclick="setMode('insect', this)">昆蟲複眼</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const loading = document.getElementById('loading');
        
        let currentMode = 'human';
        let animationFrameId = null;
        let videoWidth = 0, videoHeight = 0;

        // 離屏 Canvas 用於低解析度運算（模擬貓狗與昆蟲視力模糊/馬賽克）
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d', { alpha: false });

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        videoWidth = video.videoWidth;
                        videoHeight = video.videoHeight;
                        resolve();
                    };
                });

                canvas.width = videoWidth;
                canvas.height = videoHeight;
                loading.style.display = 'none';
                
                requestAnimationFrame(renderLoop);
            } catch (err) {
                console.error("相機錯誤:", err);
                try {
                    // 若無後鏡頭（如電腦測試），降級為任意相機
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    await new Promise((r) => { video.onloadedmetadata = r; });
                    videoWidth = video.videoWidth;
                    videoHeight = video.videoHeight;
                    canvas.width = videoWidth;
                    canvas.height = videoHeight;
                    loading.style.display = 'none';
                    requestAnimationFrame(renderLoop);
                } catch (e) {
                    loading.innerText = "無法存取相機，請確認瀏覽器權限或使用 HTTPS 連線。";
                }
            }
        }

        function renderLoop() {
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                if (currentMode === 'human') {
                    ctx.imageSmoothingEnabled = true;
                    ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
                } else if (currentMode === 'dog') {
                    renderDogVision();
                } else if (currentMode === 'snake') {
                    renderSnakeVision();
                } else if (currentMode === 'insect') {
                    renderInsectVision();
                }
            }
            animationFrameId = requestAnimationFrame(renderLoop);
        }

        // 1. 貓狗視覺：二色視覺矩陣 + 視力模糊降採樣
        function renderDogVision() {
            // 縮小畫面模擬低視力（近視約 0.3）
            const scale = 0.25; 
            const sw = Math.floor(videoWidth * scale);
            const sh = Math.floor(videoHeight * scale);
            
            offCanvas.width = sw;
            offCanvas.height = sh;
            offCtx.drawImage(video, 0, 0, sw, sh);
            
            const imgData = offCtx.getImageData(0, 0, sw, sh);
            const data = imgData.data;

            // 二色視覺投影演算法 (Dichromacy Transformation)
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // 將紅綠通道壓縮，轉換為犬貓能感知的藍黃色域
                const L = 0.299 * r + 0.587 * g + 0.114 * b; // 亮度
                data[i]     = Math.min(255, L * 1.1); // R
                data[i + 1] = Math.min(255, L * 1.1); // G
                data[i + 2] = b;                      // B (保留藍色)
            }
            offCtx.putImageData(imgData, 0, 0);

            // 放大回主畫面（利用最近鄰插值產生自然模糊感）
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(offCanvas, 0, 0, sw, sh, 0, 0, videoWidth, videoHeight);
        }

        // 2. 蛇類熱視角：科學鐵弓熱感應映射 (Ironbow Thermal Palette)
        function renderSnakeVision() {
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
            
            const imgData = ctx.getImageData(0, 0, videoWidth, videoHeight);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // 計算灰階能量值
                const val = (r * 0.299 + g * 0.587 + b * 0.114);
                
                let nr, ng, nb;
                // 熱感應偽彩漸層映射
                if (val < 64) { // 低溫區：黑到深藍
                    nr = 0; ng = 0; nb = val * 4;
                } else if (val < 128) { // 中低溫：藍到紅
                    nr = (val - 64) * 4; ng = 0; nb = 255 - (val - 64) * 4;
                } else if (val < 192) { // 中高溫：紅到黃
                    nr = 255; ng = (val - 128) * 4; nb = 0;
                } else { // 高溫熱源區：黃到白
                    nr = 255; ng = 255; nb = (val - 192) * 4;
                }
                
                data[i]     = nr;
                data[i + 1] = ng;
                data[i + 2] = nb;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // 3. 昆蟲複眼視角：低解小眼離散成像 + 光學暗角
        function renderInsectVision() {
            const pixelSize = 14; // 複眼小眼密度單元
            const sw = Math.floor(videoWidth / pixelSize);
            const sh = Math.floor(videoHeight / pixelSize);

            offCanvas.width = sw;
            offCanvas.height = sh;
            offCtx.drawImage(video, 0, 0, sw, sh);

            // 放大並強制馬賽克像素化
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(offCanvas, 0, 0, sw, sh, 0, 0, videoWidth, videoHeight);

            // 疊加各個小眼邊緣的光學暗角 (Vignetting)
            const imgData = ctx.getImageData(0, 0, videoWidth, videoHeight);
            const data = imgData.data;
            const cx = videoWidth / 2;
            const cy = videoHeight / 2;
            const maxDist = Math.sqrt(cx * cx + cy * cy);

            for (let y = 0; y < videoHeight; y++) {
                for (let x = 0; x < videoWidth; x++) {
                    const i = (y * videoWidth + x) * 4;
                    // 模擬單眼周邊光線遞減
                    const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
                    const vignette = Math.max(0.3, 1.15 - (dist / maxDist));
                    
                    data[i]     *= vignette;
                    data[i + 1] *= vignette;
                    data[i + 2] *= vignette;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            ctx.imageSmoothingEnabled = true;
        }

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        initCamera();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(animationFrameId);
            } else if (video.srcObject) {
                requestAnimationFrame(renderLoop);
            }
        });
    </script>
</body>
</html>
