<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>UMWELT｜跨物種視角模擬器</title>
<style>
:root{--ink:#0a0d0a;--ink-2:#12160f;--paper:#e7e3d3;--paper-dim:#9c9a86;--phosphor:#8fe38f;--phosphor-dim:#4f7a52;--rust:#c2652e;--amber:#d9a441;--slate:#31382f;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overscroll-behavior:none;background:var(--ink);color:var(--paper);font-family:var(--mono);overflow:hidden}
body{height:100vh;height:100dvh}
#boot{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% -10%,rgba(143,227,143,.08),transparent 60%),var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.boot-inner{max-width:440px;width:100%;text-align:center}.boot-eyebrow{font-size:10px;letter-spacing:.2em;color:var(--phosphor-dim);margin-bottom:16px}
#boot h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:50px;color:var(--paper);margin-bottom:14px}.boot-sub{font-size:12.5px;line-height:1.7;color:var(--paper-dim);margin-bottom:26px}
#startBtn{font-family:var(--mono);font-size:14px;letter-spacing:.08em;background:var(--phosphor);color:#04140a;border:none;padding:15px 30px;font-weight:700;cursor:pointer;width:100%;border-radius:2px;touch-action:manipulation}
#startBtn:active{background:#79cc7d}.boot-msg{margin-top:16px;font-size:12px;color:var(--rust);min-height:16px;line-height:1.6}.boot-refs{margin-top:24px;font-size:8.5px;letter-spacing:.02em;color:#4a4d43;border-top:1px solid var(--slate);padding-top:14px;line-height:1.7}
#app{position:fixed;inset:0;display:flex;flex-direction:column}#app[hidden]{display:none}
#viewfinder{flex:1;position:relative;width:100%;background:#000;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;object-fit:cover}
canvas{width:100%;height:100%;object-fit:cover;display:block}#viewfinder.mirror canvas{transform:scaleX(-1)}
#hud{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 66px 8px 14px;background:linear-gradient(to bottom,rgba(10,13,10,.85),transparent);pointer-events:none}
.hud-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.hud-species{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--paper)}.hud-live{font-size:9px;letter-spacing:.12em;color:var(--phosphor);display:flex;align-items:center;gap:4px;flex-shrink:0}.dot{width:6px;height:6px;border-radius:50%;background:var(--phosphor);display:inline-block;animation:blink 1.6s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hud-data{margin-top:4px;font-size:10.5px;color:var(--amber);line-height:1.5}.hud-note{margin-top:2px;font-size:9px;color:var(--paper-dim);line-height:1.5}
#topRight{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:6;display:flex;flex-direction:column;gap:8px;align-items:center}.round-btn{width:38px;height:38px;border-radius:50%;background:rgba(10,13,10,.55);border:1px solid var(--slate);color:var(--paper);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--mono);touch-action:manipulation}
#irBtn.active{background:var(--rust);border-color:var(--rust);color:#1a0800}#irBtn:disabled{opacity:.25;pointer-events:none}
#ui-panel{display:flex;flex-direction:column;background:var(--ink-2);border-top:1px solid var(--slate);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
#cat-bar{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid #1a2018;overflow-x:auto;scrollbar-width:none}#cat-bar::-webkit-scrollbar,#sub-bar::-webkit-scrollbar{display:none}
.cat-btn{flex:0 0 auto;padding:8px 16px;font-family:var(--mono);font-size:12px;color:var(--paper-dim);background:transparent;border:1px solid transparent;cursor:pointer;touch-action:manipulation}.cat-btn.active{color:var(--phosphor);border-bottom:2px solid var(--phosphor)}
#sub-bar{display:flex;gap:6px;padding:10px;overflow-x:auto;scrollbar-width:none}.sub-btn{flex:0 0 84px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border:1px solid var(--slate);border-radius:4px;background:transparent;color:var(--paper-dim);font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation}.sub-btn span{font-size:9px;font-weight:400;color:inherit;opacity:.7}.sub-btn.active{background:var(--phosphor);border-color:var(--phosphor);color:#04140a}.sub-btn.active span{color:#0a2b0f;opacity:.85}
</style>
</head>
<body>
<div id="boot"><div class="boot-inner"><div class="boot-eyebrow">COMPARATIVE VISUAL PERCEPTION INSTRUMENT</div><h1>Umwelt</h1><p class="boot-sub">生物光學文獻模擬系統。可觀測光譜的受體近似模型 — UV／紅外等不可由手機相機量測的波段，一律明確標示為示意，不偽造成真實感測資料。</p><button id="startBtn">啟動相機感測 →</button><p class="boot-msg" id="bootMsg"></p><div class="boot-refs">REF — Machado, Oliveira &amp; Fernandes 2009 · Brettel, Viénot &amp; Mollon 1997/1999 · Peichl 2005 · Hardie 1985</div></div></div>
<div id="app" hidden><div id="viewfinder"><video id="webcam" autoplay playsinline muted></video><canvas id="canvas"></canvas><div id="hud"><div class="hud-row"><span class="hud-species" id="hudSpecies"></span><span class="hud-live"><i class="dot"></i>LIVE</span></div><div class="hud-data" id="hudData"></div><div class="hud-note" id="hudNote"></div></div><div id="topRight"><button id="flipBtn" class="round-btn" aria-label="切換鏡頭">⟲</button><button id="irBtn" class="round-btn" aria-label="熱感代理示意">IR</button></div></div><div id="ui-panel"><div id="cat-bar"><button class="cat-btn active" data-cat="human">人類群集</button><button class="cat-btn" data-cat="dogcat">犬貓群集</button><button class="cat-btn" data-cat="insect">昆蟲群集</button><button class="cat-btn" data-cat="snake">蛇類群集</button></div><div id="sub-bar"></div></div></div>
<script>
(function(){
'use strict';
const DB={
 human:[
  {id:'h-norm',label:'正常三色',sub:'標準光譜',name:'Homo sapiens（正常三色視覺）',data:'S/M/L 三類視錐健全・光譜 400–700nm・視力基準 20/20',note:'全解析度直通，作為比較基準',mode:'pass'},
  {id:'h-prot',label:'紅色盲',sub:'Protanopia',name:'Homo sapiens（第一色盲・Protanopia）',data:'L-錐缺失・紅綠混淆，長波區可顯得較暗',note:'Machado et al. (2009) 完整二色型模型',mode:'cvd',matrix:'protanopia',resW:520},
  {id:'h-deut',label:'綠色盲',sub:'Deuteranopia',name:'Homo sapiens（第二色盲・Deuteranopia）',data:'M-錐缺失・綠紅混淆，綠不等於「完全消失」',note:'Machado et al. (2009) 完整二色型模型；綠／紅差異主要壓縮至黃、棕、灰等區域',mode:'cvd',matrix:'deuteranopia',resW:520},
  {id:'h-trit',label:'藍色盲',sub:'Tritanopia',name:'Homo sapiens（第三色盲・Tritanopia）',data:'S-錐缺失・藍黃混淆，發生率低',note:'Machado et al. (2009) 完整二色型模型',mode:'cvd',matrix:'tritanopia',resW:520},
  {id:'h-deuta',label:'紅綠色弱',sub:'Deuteranomaly',name:'Homo sapiens（異常三色視覺・Deuteranomaly）',data:'M-錐光譜敏感度偏移・非完全缺失',note:'Machado et al. (2009) 部分嚴重度近似',mode:'cvd',matrix:'deuteranopia',severity:.55,resW:520},
  {id:'h-achr',label:'全色盲',sub:'Achromatopsia',name:'Homo sapiens（全色盲・Achromatopsia）',data:'錐細胞功能缺失・以桿細胞亮度資訊為主',note:'同時降低空間取樣；此處不模擬真正視網膜病變',mode:'gray',resW:190}
 ],
 dogcat:[
  {id:'d-dog',label:'犬類',sub:'Canis',name:'Canis lupus familiaris',data:'S-錐約429nm／L-M通道約555nm・二色視覺',note:'以犬的雙通道視覺與較低空間取樣近似',mode:'animal',resW:260,dog:true,gain:1.0},
  {id:'c-cat',label:'貓類',sub:'Felis',name:'Felis catus',data:'S-錐約450nm／L-M通道約556nm・二色視覺',note:'錐峰位置接近犬；降低空間取樣並給予有限低照度增益近似',mode:'animal',resW:190,dog:false,gain:1.18}
 ],
 insect:[
  {id:'i-bee',label:'蜜蜂',sub:'Apis',name:'Apis mellifera',data:'UV約344nm／藍約436nm／綠約556nm・三色覺',note:'手機RGB無法量測UV；畫面只使用可見光投影，六角小眼示意',mode:'hex',cols:32,tint:'bee'},
  {id:'i-fly',label:'蒼蠅',sub:'Musca',name:'Musca domestica',data:'多類感光受體・高時間解析度',note:'六角小眼採稀疏取樣；不把UV數值偽造成手機可見色',mode:'hex',cols:24,tint:'fly',motion:true},
  {id:'i-mosq',label:'蚊子',sub:'Culicidae',name:'Culicidae',data:'複眼空間解析較低・另具非視覺熱／CO₂感測',note:'六角小眼大幅稀疏；IR按鈕只開啟可見亮度暖區代理，不是真正紅外資料',mode:'hex',cols:12,tint:'mosq',ir:true}
 ],
 snake:[
  {id:'s-viper',label:'響尾蛇',sub:'Viperidae',name:'Crotalinae（頰窩亞科）',data:'視覺與頰窩熱感為分離通道',note:'基礎層是低解析去飽和可見光；IR為可見亮度暖區代理，不能視為LWIR成像',mode:'snake',ir:true}
 ]
};
const video=document.getElementById('webcam'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false}),offC=document.createElement('canvas'),offCtx=offC.getContext('2d',{alpha:false}),viewfinder=document.getElementById('viewfinder'),hudSpecies=document.getElementById('hudSpecies'),hudData=document.getElementById('hudData'),hudNote=document.getElementById('hudNote'),subBar=document.getElementById('sub-bar'),irBtn=document.getElementById('irBtn'),startBtn=document.getElementById('startBtn'),bootMsg=document.getElementById('bootMsg');
let curCat='human',curMode='h-norm',irOn=false,stream=null,vW=0,vH=0,rafId=0,running=false,switching=false,facing='environment';
const HEX={};
function clamp(v){return v<0?0:v>255?255:v}
function conf(){return DB[curCat].find(x=>x.id===curMode)}
function updateHUD(){const c=conf();hudSpecies.textContent=c.name;hudData.textContent=c.data;hudNote.textContent=c.note+(c.ir?'　〔IR代理：'+(irOn?'開':'關')+'〕':'')}
function syncIR(){const c=conf();irBtn.disabled=!c.ir;if(!c.ir)irOn=false;irBtn.classList.toggle('active',!!c.ir&&irOn);updateHUD()}
function buildSub(cat){subBar.innerHTML='';DB[cat].forEach(m=>{const b=document.createElement('button');b.className='sub-btn'+(m.id===curMode?' active':'');b.innerHTML=m.label+'<span>'+m.sub+'</span>';b.onclick=()=>{curMode=m.id;subBar.querySelectorAll('.sub-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');syncIR()};subBar.appendChild(b)})}
document.querySelectorAll('.cat-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');curCat=b.dataset.cat;curMode=DB[curCat][0].id;buildSub(curCat);syncIR()}));
irBtn.addEventListener('click',()=>{if(irBtn.disabled)return;irOn=!irOn;syncIR()});

// Machado 2009 full-severity matrices for dichromacy.
const M={
 protanopia:[[0.152286,1.052583,-0.204868],[0.114503,0.786281,0.099216],[-0.003882,-0.048116,1.051998]],
 deuteranopia:[[0.367322,0.860646,-0.227968],[0.280085,0.672501,0.047413],[-0.011820,0.042940,0.968881]],
 tritanopia:[[1.255528,-0.076749,-0.178779],[-0.078411,0.930809,0.147602],[0.004733,0.691367,0.303900]]
};
function matrixPixels(d,m,severity){severity=severity==null?1:severity;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],nr=m[0][0]*r+m[0][1]*g+m[0][2]*b,ng=m[1][0]*r+m[1][1]*g+m[1][2]*b,nb=m[2][0]*r+m[2][1]*g+m[2][2]*b;d[i]=clamp(r+(nr-r)*severity);d[i+1]=clamp(g+(ng-g)*severity);d[i+2]=clamp(b+(nb-b)*severity)}}
function grayPixels(d){for(let i=0;i<d.length;i+=4){const y=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];d[i]=d[i+1]=d[i+2]=y}}
function drawProcessed(w,fn){const h=Math.max(1,Math.round(w*vH/vW));offC.width=w;offC.height=h;offCtx.drawImage(video,0,0,w,h);const img=offCtx.getImageData(0,0,w,h);fn(img.data);offCtx.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(offC,0,0,w,h,0,0,vW,vH)}
function renderPass(){ctx.imageSmoothingEnabled=true;ctx.drawImage(video,0,0,vW,vH)}
function renderHuman(c){if(c.mode==='pass')renderPass();else if(c.mode==='gray')drawProcessed(c.resW,grayPixels);else drawProcessed(c.resW,d=>matrixPixels(d,M[c.matrix],c.severity))}
function renderAnimal(c){const w=c.resW,h=Math.max(1,Math.round(w*vH/vW));offC.width=w;offC.height=h;offCtx.drawImage(video,0,0,w,h);const img=offCtx.getImageData(0,0,w,h),d=img.data,dog=c.dog;for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,s=.06*r+(dog?.15:.13)*g+(dog?.79:.83)*b,lm=(dog?.34:.38)*r+.58*g+.08*b,chrom=s/(s+lm+1e-6),lum=Math.min(1,(s+lm)*.58*c.gain);d[i]=clamp(255*lum*(.86+.14*chrom));d[i+1]=clamp(255*lum*(.74+.26*(1-chrom)));d[i+2]=clamp(255*lum*(.25+.75*chrom))}offCtx.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(offC,0,0,w,h,0,0,vW,vH)}
function hexGeom(cols){const key=cols+'x'+vW+'x'+vH;if(HEX[key])return HEX[key];const r=vW/(cols*Math.sqrt(3)),cw=Math.sqrt(3)*r,rw=1.5*r;return HEX[key]={r,cw,rw,cols:Math.ceil(vW/cw)+2,rows:Math.ceil(vH/rw)+2}}
function tint(r,g,b,type){const y=.3*r+.59*g+.11*b;if(type==='bee')return [clamp(.08*r+.14*g),clamp(.75*g+.18*b),clamp(.82*b+.14*g+10)];if(type==='fly')return [clamp(.08*r+.18*g),clamp(.72*g+.16*b),clamp(.88*b+.10*g+8)];return [clamp(y*.5),clamp(y*.72),clamp(y*.88)]}
const prevMotion={};
function renderHex(c){const g=hexGeom(c.cols);offC.width=g.cols;offC.height=g.rows;offCtx.drawImage(video,0,0,g.cols,g.rows);const d=offCtx.getImageData(0,0,g.cols,g.rows).data;ctx.fillStyle='#000';ctx.fillRect(0,0,vW,vH);if(!prevMotion[c.id])prevMotion[c.id]=new Float32Array(g.cols*g.rows);const prev=prevMotion[c.id];for(let y=0;y<g.rows;y++){const ox=y%2?g.cw/2:0;for(let x=0;x<g.cols;x++){const k=y*g.cols+x,i=k*4;let [rr,gg,bb]=tint(d[i],d[i+1],d[i+2],c.tint);if(c.motion){const lum=.3*d[i]+.59*d[i+1]+.11*d[i+2],delta=Math.abs(lum-prev[k]);prev[k]=lum;if(delta>18){const q=Math.min(1,delta/70);gg=clamp(gg+65*q);rr=clamp(rr+20*q)}}const cx=x*g.cw+ox,cy=y*g.rw;ctx.beginPath();for(let j=0;j<6;j++){const a=Math.PI/180*(60*j-30),px=cx+g.r*.94*Math.cos(a),py=cy+g.r*.94*Math.sin(a);j?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fillStyle='rgb('+rr+','+gg+','+bb+')';ctx.fill()}}if(c.ir&&irOn)warmProxy()}
function warmProxy(){const w=8,h=6;offC.width=w;offC.height=h;offCtx.drawImage(video,0,0,w,h);const d=offCtx.getImageData(0,0,w,h).data,cw=vW/w,ch=vH/h;ctx.save();ctx.globalCompositeOperation='lighter';for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,l=(.3*d[i]+.59*d[i+1]+.11*d[i+2])/255;if(l<.55)continue;const X=x*cw+cw/2,Y=y*ch+ch/2,rad=cw*1.5,a=(l-.55)*.35,gr=ctx.createRadialGradient(X,Y,0,X,Y,rad);gr.addColorStop(0,'rgba(217,164,65,'+a+')');gr.addColorStop(1,'rgba(217,164,65,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(X,Y,rad,0,Math.PI*2);ctx.fill()}ctx.restore()}
function renderSnake(c){const w=52;drawProcessed(w,d=>{for(let i=0;i<d.length;i+=4){const y=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];d[i]=clamp(y*.92);d[i+1]=clamp(y*.88);d[i+2]=clamp(y*.86)}});if(c.ir&&irOn)warmProxy()}
function renderCurrent(){const c=conf();if(curCat==='human')renderHuman(c);else if(curCat==='dogcat')renderAnimal(c);else if(c.mode==='hex')renderHex(c);else renderSnake(c)}
function loop(){if(!running)return;if(video.readyState<video.HAVE_CURRENT_DATA||!vW||!vH){rafId=requestAnimationFrame(loop);return}try{renderCurrent()}catch(e){}rafId=requestAnimationFrame(loop)}

function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.pause();video.srcObject=null}
function waitVideo(){return new Promise((resolve,reject)=>{if(video.readyState>=video.HAVE_METADATA&&video.videoWidth>0){resolve();return}let done=false;const timer=setTimeout(()=>{if(done)return;done=true;reject(new Error('Camera metadata timeout'))},10000);const check=()=>{if(done)return;if(video.videoWidth>0&&video.videoHeight>0){done=true;clearTimeout(timer);video.removeEventListener('loadedmetadata',check);video.removeEventListener('canplay',check);resolve()}};video.addEventListener('loadedmetadata',check);video.addEventListener('canplay',check)})}
function fit(){vW=video.videoWidth;vH=video.videoHeight;if(!vW||!vH)throw new Error('Invalid camera dimensions');canvas.width=vW;canvas.height=vH;for(const k in HEX)delete HEX[k]}
async function openCamera(mode){if(switching)return;switching=true;running=false;cancelAnimationFrame(rafId);stopCamera();try{let c={audio:false,video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}};try{stream=await navigator.mediaDevices.getUserMedia(c)}catch(e){stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:mode}})}video.srcObject=stream;video.muted=true;video.playsInline=true;video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','true');await waitVideo();await video.play();fit();viewfinder.classList.toggle('mirror',mode==='user');switching=false}catch(e){switching=false;stopCamera();throw e}}
startBtn.addEventListener('click',async()=>{startBtn.disabled=true;startBtn.textContent='初始化光學中…';bootMsg.textContent='';try{await openCamera(facing);document.getElementById('boot').style.display='none';document.getElementById('app').hidden=false;buildSub(curCat);syncIR();running=true;loop()}catch(e){bootMsg.textContent='相機啟動失敗：'+(e.name||e.message||'Unknown error');startBtn.textContent='重試 →';startBtn.disabled=false}})
document.getElementById('flipBtn').addEventListener('click',async()=>{if(switching)return;const next=facing==='environment'?'user':'environment';try{await openCamera(next);facing=next;running=true;loop()}catch(e){hudNote.textContent='鏡頭切換失敗：'+(e.name||e.message||'Unknown error')}})
document.addEventListener('visibilitychange',async()=>{if(document.hidden){running=false;cancelAnimationFrame(rafId)}else if(stream&&video.readyState>=video.HAVE_CURRENT_DATA){try{await video.play();fit();running=true;loop()}catch(e){}}})
window.addEventListener('pagehide',stopCamera);window.addEventListener('beforeunload',stopCamera);window.addEventListener('resize',()=>{if(video.videoWidth&&video.videoHeight)fit()});window.addEventListener('orientationchange',()=>setTimeout(()=>{if(video.videoWidth&&video.videoHeight)fit()},300));
buildSub(curCat);syncIR();
})();
</script>
</body>
</html>
