<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>真實動物視角模擬器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        #viewfinder { flex: 1; position: relative; width: 100%; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
        
        /* 確保手機鏡頭畫面不變形、填滿螢幕 */
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        /* 動物視覺濾鏡 */
        .filter-dog { filter: sepia(40%) hue-rotate(185deg) saturate(1.1) contrast(1.05); }
        .filter-insect { filter: contrast(160%) brightness(85%) saturate(1.2); }
        .filter-snake { filter: grayscale(100%) invert(100%) contrast(180%); }
        
        /* 昆蟲複眼視覺效果：多重邊緣暈影與網格感 */
        #insect-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 85%),
                              repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 2px, transparent 2px, transparent 4px);
            display: none;
        }

        #controls { padding: 12px 16px; background: rgba(20, 20, 20, 0.95); display: flex; justify-content: space-between; gap: 8px; z-index: 10; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        button { flex: 1; padding: 12px 6px; border: none; border-radius: 8px; background: #333; color: #aaa; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        button.active { background: #007aff; color: #fff; font-weight: bold; transform: scale(1.02); }
    </style>
</head>
<body>

    <div id="viewfinder">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="insect-overlay"></div>
    </div>

    <div id="controls">
        <button class="active" onclick="setMode('human', this)">人類</button>
        <button onclick="setMode('dog', this)">貓狗</button>
        <button onclick="setMode('insect', this)">昆蟲複眼</button>
        <button onclick="setMode('snake', this)">蛇類熱視</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const insectOverlay = document.getElementById('insect-overlay');

        async function initCamera() {
            try {
                // 強制優先調用手機「後鏡頭」
                const constraints = {
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                };
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    // 若後鏡頭抓取失敗（部分桌機或特殊環境），改用一般相機
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                }
                video.srcObject = stream;
            } catch (err) {
                alert("無法存取相機，請確認瀏覽器是否已授權相機權限。");
            }
        }

        function setMode(mode, btn) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            video.className = '';
            insectOverlay.style.display = 'none';

            if (mode === 'dog') {
                video.classList.add('filter-dog');
            } else if (mode === 'insect') {
                video.classList.add('filter-insect');
                insectOverlay.style.display = 'block';
            } else if (mode === 'snake') {
                video.classList.add('filter-snake');
            }
        }

        initCamera();
    </script>
</body>
</html>
