<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生物光學視覺模擬器 v1.1.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
        
        #header-bar { background: rgba(10, 10, 10, 0.95); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; z-index: 10; }
        #header-bar h1 { font-size: 14px; font-weight: 600; color: #ddd; }
        #header-bar .version { font-size: 11px; color: #666; background: #1a1a1a; padding: 2px 6px; border-radius: 4px; }

        #viewfinder { flex: 1; position: relative; width: 100%; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
        
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; z-index: 1; }
        canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
        
        /* 昆蟲複眼光學小眼蜂巢網格 */
        #insect-grid { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 3; display: none; background-image: radial-gradient(circle, rgba(0,0,0,0.4) 1px, transparent 1px); background-size: 10px 10px; }

        #controls { padding: 12px 16px; background: rgba(15, 15, 15, 0.98); display: flex; justify-content: space-around; gap: 8px; z-index: 10; padding-bottom: calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
        button { flex: 1; padding: 12px 6px; border: none; border-radius: 8px; background: #2a2a2a; color: #aaa; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
        button.active { background: #ffaa00; color: #000; font-weight: bold; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,170,0,0.4); }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; color: #888; text-align: center; z-index: 5; }
    </style>
</head>
<body>

    <div id="header-bar">
        <h1>生物光學視覺模擬器</h1>
        <span class="version">v1.1.1</span>
    </div>

    <div id="viewfinder">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="insect-grid"></div>
        <div id="loading">載入神經光學模型中...</div>
    </div>

    <div id="controls">
        <button class="active" onclick="setMode('human', this)">人類</button>
        <button onclick="setMode('dog', this)">貓狗</button>
        <button onclick="setMode('snake', this)">蛇類熱視</button>
        <button onclick="setMode('insect', this)">昆蟲複眼</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const loading = document.getElementById('loading');
        const insectGrid = document.getElementById('insect-grid');
        
        let currentMode = 'human';
        let animationFrameId = null;
        let videoWidth = 0, videoHeight = 0;

        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d', { alpha: false });

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();

                await new Promise((resolve) => {
                    if (video.videoWidth > 0) resolve();
                    else video.onloadedmetadata = () => resolve();
                });

                videoWidth = video.videoWidth || 1280;
                videoHeight = video.videoHeight || 720;

                canvas.width = videoWidth;
                canvas.height = videoHeight;
                loading.style.display = 'none';
                
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(renderLoop);
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    await video.play();
                    
                    videoWidth = video.videoWidth || 640;
                    videoHeight = video.videoHeight || 480;
                    canvas.width = videoWidth;
                    canvas.height = videoHeight;
                    loading.style.display = 'none';
                    
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animationFrameId = requestAnimationFrame(renderLoop);
                } catch (e) {
                    loading.innerText = "無法存取相機，請確認瀏覽器權限。";
                }
            }
        }

        function renderLoop() {
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                if (currentMode === 'human') {
                    ctx.filter = 'none';
                    ctx.imageSmoothingEnabled = true;
                    ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
                } 
                else if (currentMode === 'dog') {
                    // 科學校正：犬貓雙色視覺（濾除紅綠，強化黃藍色頻，伴隨輕微視力折損）
                    const scale = 0.3;
                    const sw = Math.max(1, Math.floor(videoWidth * scale));
                    const sh = Math.max(1, Math.floor(videoHeight * scale));
                    
                    offCanvas.width = sw;
                    offCanvas.height = sh;
                    offCtx.filter = 'sepia(0.6) hue-rotate(150deg) saturate(1.2) contrast(1.1)';
                    offCtx.drawImage(video, 0, 0, sw, sh);

                    ctx.filter = 'none';
                    ctx.imageSmoothingEnabled = true;
                    ctx.drawImage(offCanvas, 0, 0, sw, sh, 0, 0, videoWidth, videoHeight);
                } 
                else if (currentMode === 'snake') {
                    // 科學校正：頰窩熱輻射對應（高對比熱顯像模擬）
                    ctx.filter = 'invert(0.9) grayscale(0.8) contrast(250%) brightness(110%) sepia(1) hue-rotate(-50deg)';
                    ctx.imageSmoothingEnabled = true;
                    ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
                } 
                else if (currentMode === 'insect') {
                    // 科學校正：複眼低解析度小眼陣列
                    const scale = 0.18;
                    const sw = Math.max(1, Math.floor(videoWidth * scale));
                    const sh = Math.max(1, Math.floor(videoHeight * scale));

                    offCanvas.width = sw;
                    offCanvas.height = sh;
                    offCtx.filter = 'none';
                    offCtx.drawImage(video, 0, 0, sw, sh);

                    ctx.filter = 'none';
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(offCanvas, 0, 0, sw, sh, 0, 0, videoWidth, videoHeight);
                }
            }
            animationFrameId = requestAnimationFrame(renderLoop);
        }

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (mode === 'insect') {
                insectGrid.style.display = 'block';
            } else {
                insectGrid.style.display = 'none';
            }
        }

        initCamera();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
            } else {
                if (video.paused) video.play();
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(renderLoop);
            }
        });
    </script>
</body>
</html>
