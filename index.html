<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>UMWELT｜跨物種視角模擬器</title>
<style>
  :root {
    --ink: #0a0d0a; --ink-2: #12160f; --paper: #e7e3d3; --paper-dim: #9c9a86;
    --phosphor: #8fe38f; --phosphor-dim: #4f7a52; --rust: #c2652e; --amber: #d9a441;
    --slate: #31382f;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overscroll-behavior: none; background: var(--ink); color: var(--paper); font-family: var(--mono); overflow: hidden; }

  /* ---------- 開機畫面 ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 50; background: radial-gradient(ellipse at 50% -10%, rgba(143,227,143,0.08), transparent 60%), var(--ink);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .boot-inner { max-width: 420px; width: 100%; text-align: center; }
  #boot h1 { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 52px; color: var(--paper); margin-bottom: 14px; }
  .boot-sub { font-size: 13px; line-height: 1.7; color: var(--paper-dim); margin-bottom: 30px; }
  #startBtn { font-family: var(--mono); font-size: 14px; letter-spacing: 0.08em; background: var(--phosphor); color: #04140a; border: none; padding: 15px 30px; font-weight: 700; cursor: pointer; width: 100%; }
  .boot-msg { margin-top: 16px; font-size: 12px; color: var(--rust); min-height: 16px; }

  /* ---------- 主程式區 ---------- */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #app[hidden] { display: none; }

  #viewfinder { flex: 1; position: relative; width: 100%; background: #000; overflow: hidden; }
  video { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
  #viewfinder.mirror canvas { transform: scaleX(-1); }

  /* ---------- HUD 指示 ---------- */
  #hud { position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: calc(10px + env(safe-area-inset-top)) 14px 8px; background: linear-gradient(to bottom, rgba(10,13,10,0.85), transparent); pointer-events: none; }
  .hud-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .hud-species { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--paper); }
  .hud-data { margin-top: 4px; font-size: 11px; color: var(--amber); line-height: 1.5; }
  .hud-note { margin-top: 2px; font-size: 9px; color: var(--paper-dim); line-height: 1.5; }
  #flipBtn { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 6; width: 38px; height: 38px; border-radius: 50%; background: rgba(10,13,10,0.55); border: 1px solid var(--slate); color: var(--paper); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* ---------- 雙層控制列 ---------- */
  #ui-panel { display: flex; flex-direction: column; background: var(--ink-2); border-top: 1px solid var(--slate); z-index: 5; padding-bottom: env(safe-area-inset-bottom); }
  
  /* 上層：主群組 */
  #cat-bar { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid #1a2018; overflow-x: auto; scrollbar-width: none; }
  #cat-bar::-webkit-scrollbar { display: none; }
  .cat-btn { flex: 0 0 auto; padding: 8px 16px; font-family: var(--mono); font-size: 12px; color: var(--paper-dim); background: transparent; border: 1px solid transparent; cursor: pointer; }
  .cat-btn.active { color: var(--phosphor); border-bottom: 2px solid var(--phosphor); }

  /* 下層：次分類 */
  #sub-bar { display: flex; gap: 6px; padding: 10px; overflow-x: auto; scrollbar-width: none; }
  #sub-bar::-webkit-scrollbar { display: none; }
  .sub-btn { flex: 0 0 82px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border: 1px solid var(--slate); border-radius: 4px; background: transparent; color: var(--paper-dim); font-family: var(--mono); font-size: 13px; font-weight: 700; cursor: pointer; }
  .sub-btn span { font-size: 9px; font-weight: 400; color: inherit; opacity: 0.7; }
  .sub-btn.active { background: var(--phosphor); border-color: var(--phosphor); color: #04140a; }
  .sub-btn.active span { color: #0a2b0f; opacity: 0.85; }
</style>
</head>
<body>

  <div id="boot">
    <div class="boot-inner">
      <h1>Umwelt</h1>
      <p class="boot-sub">生物光學文獻模擬系統・可觀測光譜受體近似（UV/IR 不偽造）</p>
      <button id="startBtn">啟動相機感測 →</button>
      <p class="boot-msg" id="bootMsg"></p>
    </div>
  </div>

  <div id="app" hidden>
    <div id="viewfinder">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div id="hud">
        <div class="hud-row"><span class="hud-species" id="hudSpecies"></span></div>
        <div class="hud-data" id="hudData"></div>
        <div class="hud-note" id="hudNote"></div>
      </div>
      <button id="flipBtn">⟲</button>
    </div>

    <div id="ui-panel">
      <div id="cat-bar">
        <button class="cat-btn active" data-cat="human">人類群集</button>
        <button class="cat-btn" data-cat="dogcat">犬貓群集</button>
        <button class="cat-btn" data-cat="insect">昆蟲群集</button>
        <button class="cat-btn" data-cat="snake">蛇類群集</button>
      </div>
      <div id="sub-bar"></div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  const DB = {
    human: [
      { id: 'h-norm', label: '正常三色', sub: '標準光譜', name: 'Homo sapiens (Normal)', data: '光譜 400-700nm・高解析度', note: 'Viénot 1999 基準模型：L/M/S 視錐細胞健全' },
      { id: 'h-prot', label: '紅色盲', sub: 'Protanopia', name: 'Homo sapiens (Protanopia)', data: 'L-Cone 缺失・紅色識別障礙', note: 'Viénot 1999 轉換矩陣：長波光譜壓縮' },
      { id: 'h-deut', label: '綠色盲', sub: 'Deuteranopia', name: 'Homo sapiens (Deuteranopia)', data: 'M-Cone 缺失・綠色識別障礙', note: 'Viénot 1999 修正模型：綠色光譜轉譯為黃褐色/灰黃' },
      { id: 'h-trit', label: '藍色盲', sub: 'Tritanopia', name: 'Homo sapiens (Tritanopia)', data: 'S-Cone 缺失・藍黃色覺軸崩潰', note: 'Viénot 1999 修正模型：藍色光譜轉譯為青綠色與灰階' },
      { id: 'h-achr', label: '全色盲', sub: 'Achromatopsia', name: 'Homo sapiens (Achromatopsia)', data: '無視錐細胞・僅桿狀細胞作用', note: '僅保留灰階亮度矩陣 (Luminance)' }
    ],
    dogcat: [
      { id: 'd-dog', label: '犬類', sub: 'Canis', name: 'Canis lupus familiaris', data: '雙色覺・S/L-M錐體峰值約429/555 nm', note: '犬雙色覺；錐體峰值約429/555 nm' },
      { id: 'c-cat', label: '貓類', sub: 'Felis', name: 'Felis catus', data: '雙色覺・S/L錐體峰值約450/556 nm', note: '貓具S/L錐體；峰值約450/556 nm，另有大量桿細胞' }
    ],
    insect: [
      { id: 'i-bee', label: '蜜蜂', sub: 'Apis', name: 'Apis mellifera', data: 'UV-藍-綠三色覺・UV無法由RGB相機直接量測', note: 'Apis mellifera：UV/藍/綠三類感光受體；本裝置無UV感測器，僅顯示可見光近似' },
      { id: 'i-fly', label: '蒼蠅', sub: 'Musca', name: 'Musca domestica', data: '複眼取樣幾何・多類視覺受體', note: '昆蟲複眼：多受體與六角小眼排列；本模型為幾何近似' },
      { id: 'i-mosq', label: '蚊子', sub: 'Culicidae', name: 'Culicidae', data: '低解析度、高對比可見光近似', note: '本模型不把RGB亮度冒充紅外熱感測' }
    ],
    snake: [
      { id: 's-viper', label: '響尾蛇', sub: 'Viperidae', name: 'Crotalinae (Pit Organ)', data: '頰窩紅外輻射感知；RGB相機無法直接量測長波紅外', note: '頰窩可感受熱輻射；本模型不由RGB偽造熱成像' }
    ]
  };

  const video = document.getElementById('webcam');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const offC = document.createElement('canvas');
  const offCtx = offC.getContext('2d', { willReadFrequently: true });

  let curCat = 'human', curMode = 'h-norm';
  let stream = null, vW = 0, vH = 0, rafId = null, running = false;
  let flyGeom = null;

  function clamp(v){ return v<0?0:(v>255?255:v); }

  function updateHUD(){
    const conf = DB[curCat].find(m => m.id === curMode);
    document.getElementById('hudSpecies').textContent = conf.name;
    document.getElementById('hudData').textContent = conf.data;
    document.getElementById('hudNote').textContent = conf.note;
  }

  function buildSubMenu(cat){
    const subBar = document.getElementById('sub-bar');
    subBar.innerHTML = '';
    DB[cat].forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'sub-btn' + (m.id === curMode ? ' active' : '');
      btn.innerHTML = `${m.label}<span>${m.sub}</span>`;
      btn.onclick = () => {
        curMode = m.id;
        document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        updateHUD();
      };
      subBar.appendChild(btn);
    });
  }

  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      curCat = btn.dataset.cat;
      curMode = DB[curCat][0].id;
      buildSubMenu(curCat);
      updateHUD();
    });
  });

  /* ---------- 科學視覺模型 ----------
     限制：一般 RGB 相機無法真正量測 340–400 nm UV 或 8–14 µm LWIR。
     因此本引擎只從可觀測 RGB 做 receptor-space 近似，不偽裝成光譜重建。
  */
  const REC = {
    dog: [429,555], cat: [450,556], bee: [344,436,556],
    // Musca domestica：示意使用五類視覺受體的主峰；僅作可見光近似
    fly: [345,375,437,478,508]
  };

  function srgbToLinear(c){
    c/=255;
    return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
  }
  function linearToSrgb(c){
    c=Math.max(0,Math.min(1,c));
    return c<=0.0031308 ? 12.92*c : 1.055*Math.pow(c,1/2.4)-0.055;
  }
  function gauss(x,mu,sigma){
    const z=(x-mu)/sigma;
    return Math.exp(-0.5*z*z);
  }

  // 從線性 sRGB 近似取得光譜受體激發。
  // 這不是 RGB→光譜反演；UV/IR 被明確視為不可觀測。
  function receptorExcitation(r,g,b,peaks){
    const R=r/255, G=g/255, B=b/255;
    const out=[];
    const visible=[[610,0.24],[550,0.24],[450,0.20]];
    for(const p of peaks){
      let s=0;
      s += R*gauss(p,610,38);
      s += G*gauss(p,550,32);
      s += B*gauss(p,450,28);
      out.push(s);
    }
    return out;
  }

  function setRGB(d,i,r,g,b){
    d[i]=Math.round(clamp(255*linearToSrgb(r)));
    d[i+1]=Math.round(clamp(255*linearToSrgb(g)));
    d[i+2]=Math.round(clamp(255*linearToSrgb(b)));
  }

  function renderReceptors(resW, modeId){
    const resH=Math.max(1,Math.floor(resW*(vH/vW)));
    offC.width=resW; offC.height=resH;
    offCtx.drawImage(video,0,0,resW,resH);
    const img=offCtx.getImageData(0,0,resW,resH);
    const d=img.data;

    for(let i=0;i<d.length;i+=4){
      const r=srgbToLinear(d[i]), g=srgbToLinear(d[i+1]), b=srgbToLinear(d[i+2]);

      if(modeId==='h-prot' || modeId==='h-deut' || modeId==='h-trit'){
        // Brettel/Vienot 類方法應在 LMS/線性空間做；此處以光譜受體壓縮近似。
        const L=0.7*r+0.25*g+0.05*b;
        const M=0.20*r+0.72*g+0.08*b;
        const S=0.04*r+0.18*g+0.78*b;
        if(modeId==='h-prot') setRGB(d,i,M,M,S);
        else if(modeId==='h-deut') setRGB(d,i,L,L,S);
        else setRGB(d,i,L,M,M);
      }
      else if(modeId==='h-achr'){
        const y=0.2126*r+0.7152*g+0.0722*b;
        setRGB(d,i,y,y,y);
      }
      else if(modeId==='d-dog' || modeId==='c-cat'){
        const peaks=modeId==='d-dog'?REC.dog:REC.cat;
        const q=receptorExcitation(d[i],d[i+1],d[i+2],peaks);
        const s=q[0], l=q[1];
        // 視覺化兩受體訊號；不把「不存在的顏色」硬造出來。
        const total=Math.max(1e-6,s+l);
        const chrom=s/total;
        const lum=Math.min(1,total*0.72);
        setRGB(d,i,
          lum*(0.85+0.15*chrom),
          lum*(0.78+0.22*(1-chrom)),
          lum*(0.35+0.65*chrom)
        );
      }
      else if(modeId==='i-bee'){
        const q=receptorExcitation(d[i],d[i+1],d[i+2],REC.bee);
        const uv=q[0], blue=q[1], green=q[2];
        // RGB camera cannot observe UV; use only the visible channels.
        // UV is deliberately not synthesized from blue.
        const sum=Math.max(1e-6,blue+green);
        const chrom=blue/sum;
        const lum=Math.min(1,(blue+green)*0.68);
        setRGB(d,i,
          lum*(0.20+0.30*chrom),
          lum*(0.50+0.35*green/sum),
          lum*(0.75+0.20*chrom)
        );
      }
      else if(modeId==='i-mosq'){
        // 蚊科視覺不是「熱成像」；此模式僅模擬低解析度、高對比可見光。
        const y=0.2126*r+0.7152*g+0.0722*b;
        const y2=Math.pow(y,0.72);
        setRGB(d,i,y2,y2,y2);
      }
      else if(modeId==='s-viper'){
        // 不能由 RGB 推算 5–15 µm 輻射。保持可見光並降低解析度；
        // 不再製造假的 Ironbow 熱圖。
        const y=0.2126*r+0.7152*g+0.0722*b;
        setRGB(d,i,y,y,y);
      }
    }

    offCtx.putImageData(img,0,0);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(offC,0,0,resW,resH,0,0,vW,vH);
  }

  /* 蒼蠅：保留複眼幾何效果，但不聲稱是真實個體視網膜映射 */
  function processFlyEye(){
    if(!flyGeom || flyGeom.vW!==vW){
      const r=vW/36;
      flyGeom={r,cStep:Math.sqrt(3)*r,rStep:1.5*r,
        cols:Math.ceil(vW/(Math.sqrt(3)*r))+2,
        rows:Math.ceil(vH/(1.5*r))+2,vW};
    }
    const {r,cStep,rStep,cols,rows}=flyGeom;
    offC.width=cols; offC.height=rows;
    offCtx.drawImage(video,0,0,cols,rows);
    const imgData=offCtx.getImageData(0,0,cols,rows).data;
    ctx.fillStyle='#030503'; ctx.fillRect(0,0,vW,vH);

    for(let cy=0;cy<rows;cy++){
      const offX=(cy%2)?cStep/2:0;
      for(let cx=0;cx<cols;cx++){
        const idx=(cy*cols+cx)*4;
        const r0=srgbToLinear(imgData[idx]);
        const g0=srgbToLinear(imgData[idx+1]);
        const b0=srgbToLinear(imgData[idx+2]);

        // 五類受體的可見光近似，只做相對 chromatic projection。
        const q=receptorExcitation(imgData[idx],imgData[idx+1],imgData[idx+2],REC.fly);
        const uv=q[0]*0.4, violet=q[1]*0.7, blue=q[2],
              green=q[3]*0.9, green2=q[4];
        const sum=Math.max(1e-6,violet+blue+green+green2);
        const cR=0.18*uv+0.22*blue+0.18*green;
        const cG=0.25*violet+0.60*blue+0.50*green;
        const cB=0.45*violet+0.75*blue+0.55*green2;
        const lum=Math.min(1,(r0+g0+b0)/2.4);

        const x=cx*cStep+offX,y=cy*rStep;
        ctx.beginPath();
        for(let k=0;k<6;k++){
          const ang=Math.PI/180*(60*k-30);
          ctx[k===0?'moveTo':'lineTo'](x+r*0.88*Math.cos(ang),y+r*0.88*Math.sin(ang));
        }
        ctx.closePath();
        ctx.fillStyle=`rgb(${clamp(255*linearToSrgb(cR*lum))},${clamp(255*linearToSrgb(cG*lum))},${clamp(255*linearToSrgb(cB*lum))})`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x-r*0.25,y-r*0.25,r*0.16,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.14)';
        ctx.fill();
      }
    }
  }

  function processOpticalMatrix(resW,modeId){
    renderReceptors(resW,modeId);
  }


  let facing = 'environment';
  let switching = false;

  function stopCamera(){
    if(stream){
      stream.getTracks().forEach(track=>track.stop());
      stream=null;
    }
    video.srcObject=null;
  }

  function waitForVideo(){
    return new Promise((resolve,reject)=>{
      if(video.readyState>=HTMLMediaElement.HAVE_METADATA && video.videoWidth>0){
        resolve(); return;
      }
      const timer=setTimeout(()=>{
        cleanup();
        reject(new Error('Camera metadata timeout'));
      },8000);
      function cleanup(){
        clearTimeout(timer);
        video.removeEventListener('loadedmetadata',ready);
        video.removeEventListener('canplay',ready);
      }
      function ready(){
        if(video.videoWidth>0 && video.videoHeight>0){
          cleanup();
          resolve();
        }
      }
      video.addEventListener('loadedmetadata',ready,{once:false});
      video.addEventListener('canplay',ready,{once:false});
    });
  }

  function fitCanvasToVideo(){
    vW=video.videoWidth;
    vH=video.videoHeight;
    if(!vW || !vH) throw new Error('Invalid video dimensions');
    canvas.width=vW;
    canvas.height=vH;
    flyGeom=null;
  }

  async function openCamera(mode){
    if(switching) return;
    switching=true;
    running=false;
    cancelAnimationFrame(rafId);
    stopCamera();

    const base={audio:false};
    const preferred={
      audio:false,
      video:{
        facingMode:{ideal:mode},
        width:{ideal:1280},
        height:{ideal:720},
        frameRate:{ideal:30,max:30}
      }
    };

    try{
      stream=await navigator.mediaDevices.getUserMedia(preferred);
    }catch(e){
      // Fallback for browsers/devices that reject advanced constraints.
      stream=await navigator.mediaDevices.getUserMedia({
        ...base,
        video:{facingMode:mode}
      });
    }

    video.srcObject=stream;
    video.setAttribute('playsinline','');
    video.muted=true;
    await waitForVideo();
    await video.play();
    fitCanvasToVideo();
    document.getElementById('viewfinder').classList.toggle('mirror',mode==='user');
    switching=false;
  }

  document.getElementById('startBtn').addEventListener('click',async()=>{
    const btn=document.getElementById('startBtn');
    const msg=document.getElementById('bootMsg');
    btn.disabled=true;
    btn.textContent='初始化光學中…';
    msg.textContent='';

    try{
      await openCamera(facing);
      document.getElementById('boot').style.display='none';
      document.getElementById('app').hidden=false;
      buildSubMenu(curCat);
      updateHUD();
      running=true;
      loop();
    }catch(e){
      stopCamera();
      msg.textContent='相機啟動失敗：'+(e.name||'Unknown error');
      btn.textContent='重試';
      btn.disabled=false;
    }
  });

  document.getElementById('flipBtn').addEventListener('click',async()=>{
    if(switching) return;
    const next=facing==='environment'?'user':'environment';
    try{
      await openCamera(next);
      facing=next;
      running=true;
      loop();
    }catch(e){
      running=false;
      document.getElementById('hudNote').textContent='鏡頭切換失敗：'+(e.name||'Unknown error');
    }
  });

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){
      running=false;
      cancelAnimationFrame(rafId);
    }else if(video.srcObject && video.readyState>=HTMLMediaElement.HAVE_CURRENT_DATA && !running){
      running=true;
      loop();
    }
  });

  window.addEventListener('beforeunload',stopCamera);

})();
</script>
</body>
</html>
