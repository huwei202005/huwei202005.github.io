<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>科學動物視角模擬器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-touch-callout: none; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
        
        #viewfinder { flex: 1; position: relative; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
        video { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; display: block; }

        #controls { background: #111; display: flex; gap: 8px; padding: 12px 16px; z-index: 10; padding-bottom: calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #333; }
        button { flex: 1; padding: 14px 4px; border: none; border-radius: 8px; background: #222; color: #888; font-size: 14px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button.active { background: #eab308; color: #000; }
        
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #aaa; font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="viewfinder">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="status">啟動相機中...</div>
    </div>

    <div id="controls">
        <button class="active" onclick="setMode('human', this)">人類</button>
        <button onclick="setMode('dog', this)">貓狗</button>
        <button onclick="setMode('snake', this)">蛇類</button>
        <button onclick="setMode('insect', this)">昆蟲</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
        const statusEl = document.getElementById('status');
        
        let currentMode = 'human';
        let reqId = null;
        let vW = 0, vH = 0;

        const offC = document.createElement('canvas');
        const offCtx = offC.getContext('2d', { alpha: false, willReadFrequently: true });

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 960 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();

                vW = video.videoWidth || 960;
                vH = video.videoHeight || 540;
                canvas.width = vW;
                canvas.height = vH;
                statusEl.style.display = 'none';
                
                loop();
            } catch (e) {
                statusEl.innerText = "相機存取失敗，請確認權限。";
            }
        }

        function loop() {
            if (video.readyState < video.HAVE_CURRENT_DATA) {
                reqId = requestAnimationFrame(loop);
                return;
            }

            if (currentMode === 'human') {
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(video, 0, 0, vW, vH);
            } 
            else if (currentMode === 'dog') {
                const pW = 256; 
                const pH = Math.floor(pW * (vH / vW));
                
                offC.width = pW; offC.height = pH;
                offCtx.drawImage(video, 0, 0, pW, pH);
                
                let img = offCtx.getImageData(0, 0, pW, pH);
                let d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    let r = d[i], g = d[i+1], b = d[i+2];
                    let yellow_gray = 0.4 * r + 0.6 * g;
                    let blue = 0.2 * r + 0.8 * b;
                    d[i] = yellow_gray; d[i+1] = yellow_gray; d[i+2] = blue;
                }
                offCtx.putImageData(img, 0, 0);

                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(offC, 0, 0, pW, pH, 0, 0, vW, vH);
            } 
            else if (currentMode === 'snake') {
                const pW = 64;
                const pH = Math.floor(pW * (vH / vW));
                
                offC.width = pW; offC.height = pH;
                offCtx.drawImage(video, 0, 0, pW, pH);
                
                let img = offCtx.getImageData(0, 0, pW, pH);
                let d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    let lum = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
                    d[i]   = lum > 128 ? 255 : lum * 2;
                    d[i+1] = lum < 64 ? 0 : (lum < 192 ? (lum - 64) * 2 : 255);
                    d[i+2] = lum < 128 ? 0 : (lum - 128) * 2;
                }
                offCtx.putImageData(img, 0, 0);

                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(offC, 0, 0, pW, pH, 0, 0, vW, vH);
            } 
            else if (currentMode === 'insect') {
                const pW = 90;
                const pH = Math.floor(pW * (vH / vW));

                offC.width = pW; offC.height = pH;
                offCtx.imageSmoothingEnabled = true;
                offCtx.drawImage(video, 0, 0, pW, pH);

                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(offC, 0, 0, pW, pH, 0, 0, vW, vH);

                ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
                const stepX = vW / pW;
                const stepY = vH / pH;
                for (let x = 0; x <= vW; x += stepX) ctx.fillRect(x, 0, 1, vH);
                for (let y = 0; y <= vH; y += stepY) ctx.fillRect(0, y, vW, 1);
            }

            reqId = requestAnimationFrame(loop);
        }

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) cancelAnimationFrame(reqId);
            else if (video.readyState >= video.HAVE_CURRENT_DATA) loop();
        });

        init();
    </script>
</body>
</html>
